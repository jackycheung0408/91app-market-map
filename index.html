<style>
:root{

  --bg:#faf9f5; --card:#ffffff; --ink:#2c2c2a; --ink2:#5f5e5a; --ink3:#888780;
  --line:#e3e1d8; --line2:#c9c7bc; --red:#c0392b;
  --purple-bg:#eeedfe; --purple-ln:#7f77dd; --purple-tx:#3c3489;
  --teal-bg:#e1f5ee;  --teal-ln:#1d9e75;  --teal-tx:#085041;
  --coral-bg:#faece7; --coral-ln:#d85a30; --coral-tx:#712b13;
  --pink-bg:#fbeaf0;  --pink-ln:#d4537e;  --pink-tx:#72243e;
  --blue-bg:#e6f1fb;  --blue-ln:#378add;  --blue-tx:#0c447c;
  --gray-bg:#f1efe8;  --gray-ln:#b4b2a9;  --gray-tx:#444441;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f1e1c; --card:#2a2927; --ink:#edebe3; --ink2:#b4b2a9; --ink3:#888780;
    --line:#3d3c39; --line2:#55534e; --red:#e8705f;
    --purple-bg:#2e2862; --purple-ln:#afa9ec; --purple-tx:#cecbf6;
    --teal-bg:#0d4a3a;  --teal-ln:#5dcaa5;  --teal-tx:#9fe1cb;
    --coral-bg:#53200f; --coral-ln:#f0997b; --coral-tx:#f5c4b3;
    --pink-bg:#53182c;  --pink-ln:#ed93b1; --pink-tx:#f4c0d1;
    --blue-bg:#0b3258;  --blue-ln:#85b7eb; --blue-tx:#b5d4f4;

  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:21px;font-weight:600;margin:0 0 4px}

  background:var(--card);color:var(--ink2);border:1px solid var(--line2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{position:relative;width:100%;padding-bottom:138%;margin-top:12px;
  border:3px solid var(--red);border-radius:6px;background:var(--card)}
.tag{position:absolute;top:-11px;right:8px;background:var(--bg);padding:0 6px;
  font-size:11px;color:var(--red);letter-spacing:.02em}
.b{position:absolute;border-radius:5px;border:1px solid;padding:4px 3px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  text-align:center;cursor:pointer;font:inherit;transition:filter .12s,opacity .18s}
.b:hover,.b:focus-visible{filter:brightness(.94);outline:none}
.b .no{font-size:12px;font-weight:600;line-height:1.2}
.b .nm{font-size:11px;line-height:1.25}
.b .ct{font-size:10px;line-height:1.2;opacity:.8}
.b.dim{opacity:.22}
.purple{background:var(--purple-bg);border-color:var(--purple-ln);color:var(--purple-tx)}
.teal{background:var(--teal-bg);border-color:var(--teal-ln);color:var(--teal-tx)}
.coral{background:var(--coral-bg);border-color:var(--coral-ln);color:var(--coral-tx)}
.pink{background:var(--pink-bg);border-color:var(--pink-ln);color:var(--pink-tx)}
.blue{background:var(--blue-bg);border-color:var(--blue-ln);color:var(--blue-tx)}
.gray{background:var(--gray-bg);border-color:var(--gray-ln);color:var(--gray-tx);cursor:default}
.gray:hover{filter:none}
#tip{position:absolute;z-index:9;max-width:260px;background:var(--card);color:var(--ink);
  border:1px solid var(--line2);border-radius:10px;padding:10px 12px;pointer-events:none;
  box-shadow:0 6px 20px rgba(0,0,0,.14);opacity:0;transition:opacity .12s;font-size:13px}
#tip.on{opacity:1}
#tip .h{font-weight:600;font-size:14px;margin-bottom:2px}
#tip .s{color:var(--ink3);font-size:12px;margin-bottom:6px}
#tip .q{color:var(--ink2);line-height:1.55}
.panel{margin-top:16px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:16px 18px;min-height:118px}
.panel .h{font-size:16px;font-weight:600;margin:0 0 2px}
.panel .s{color:var(--ink3);font-size:13px;margin:0 0 10px}
.panel .q{color:var(--ink2);font-size:14px;margin:0}
.panel .ph{color:var(--ink3);font-size:14px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:12px;color:var(--ink3)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;border:1px solid}
@media(max-width:560px){
  .stage{padding-bottom:168%}
  .b .nm{font-size:10px}.b .ct{display:none}
}
</style>
</head>

var FIX=[
 {c:"gray",lbl:"入口 / 門　👣 你在這",p:[1.1,0.8,18.6,11.3]},
 {c:"blue",lbl:"陀螺比賽場地",p:[1.1,72.1,30.4,17.1]},
 {c:"gray",lbl:"柱",p:[26.1,55.5,5.4,3.4]}
];

var stage=document.getElementById("stage"),tip=document.getElementById("tip"),panel=document.getElementById("panel");

FIX.forEach(function(f){
  var d=document.createElement("div");
  d.className="b "+f.c;
  d.style.cssText="left:"+(100-f.p[0]-f.p[2])+"%;top:"+(100-f.p[1]-f.p[3])+"%;width:"+f.p[2]+"%;height:"+f.p[3]+"%";
  d.innerHTML='<span class="nm">'+f.lbl+'</span>';
  stage.appendChild(d);
});

B.forEach(function(b){
  var el=document.createElement("button");
  el.type="button"; el.className="b "+b.c; el.dataset.id=b.id;
  el.style.cssText="left:"+(100-b.p[0]-b.p[2])+"%;top:"+(100-b.p[1]-b.p[3])+"%;width:"+b.p[2]+"%;height:"+b.p[3]+"%";
  el.innerHTML='<span class="no">'+b.id+'</span><span class="nm">'+b.n+'</span><span class="ct">'+b.t+'</span>';
  el.addEventListener("mouseenter",function(ev){show(b);place(el)});
  el.addEventListener("mouseleave",function(){tip.classList.remove("on")});
  el.addEventListener("focus",function(){show(b);place(el)});
  el.addEventListener("blur",function(){tip.classList.remove("on")});
  el.addEventListener("click",function(){show(b);place(el)});
  stage.appendChild(el);
  b.el=el;
});

function show(b){
  tip.innerHTML='<div class="h">'+b.id+'　'+b.n+'</div><div class="s">'+b.e+' ['+b.d+']　'+b.t+'</div><div class="q">'+b.q+'</div>';
  tip.classList.add("on");
  panel.innerHTML='<p class="h">'+b.id+'　'+b.n+'　<span style="font-weight:400;color:var(--ink3);font-size:14px">'+b.e+'</span></p>'+
    '<p class="s">['+b.d+']　'+b.g.join(' · ')+'</p><p class="q">'+b.q+'</p>';
}

function place(el){
  var sr=stage.getBoundingClientRect(),er=el.getBoundingClientRect();
  var x=er.left-sr.left+er.width/2, y=er.top-sr.top;
  tip.style.left="0px"; tip.style.top="0px";
  var tw=tip.offsetWidth, th=tip.offsetHeight;
  var lx=Math.max(6,Math.min(x-tw/2,sr.width-tw-6));
  var ty=y-th-10; if(ty<6) ty=y+er.height+10;
  tip.style.left=lx+"px"; tip.style.top=ty+"px";
}

var CATS=["服飾配件","書籍文具","3C 電子","居家生活","美妝保養","玩具公仔","運動戶外","其他"];
var active=null, fw=document.getElementById("filters");
CATS.forEach(function(c){
  var btn=document.createElement("button");
  btn.type="button"; btn.className="chip"; btn.textContent=c; btn.setAttribute("aria-pressed","false");
  btn.addEventListener("click",function(){
    active = (active===c) ? null : c;
    [].forEach.call(fw.children,function(x){x.setAttribute("aria-pressed",String(x.textContent===active))});
    B.forEach(function(b){b.el.classList.toggle("dim", !!active && b.g.indexOf(active)<0)});
  });
  fw.appendChild(btn);
});
</script>
</body>
</html>
